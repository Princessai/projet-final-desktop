<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Splash Screen</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
        }

        .logo {
            width: 150px; /* Ajustez la taille du logo */
            height: auto;
            animation: fadeIn 2s ease-in-out;
        }

        .loading {
            margin-top: 20px;
            font-size: 16px;
            color: white;
            letter-spacing: 1px;
            animation: pulse 1.5s infinite;
        }

        /* Keyframes for logo animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Keyframes for loading animation */
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="assets/logo_app@2x.png" alt="TrackIn Ifran Logo" class="logo">
        <div class="loading">Loading...</div>
    </div>
</body>
</html>
